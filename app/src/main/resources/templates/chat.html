<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        #chat {
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ced4da;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .message {
            border-bottom: 1px solid #dee2e6;
            padding: 5px 0;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
<div class="container mt-3">
    <h1 class="text-center mb-4">Real-Time Chat Application</h1>

    <div id="chat" class="rounded mb-3"></div>

    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control" placeholder="Your name">
    </div>
    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control" placeholder="Type your message">
        <button id="sendMessage" class="btn btn-primary" type="button">Send</button>
    </div>
</div>

<script>
    let stompClient;

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            stompClient.subscribe('/topic/message', function(message) {
                showMessage(JSON.parse(message.body));
            });
        });

        function showMessage(message) {
            var chat = document.getElementById('chat');
            var messageElement = document.createElement('div');
            messageElement.textContent = message.sender + ': ' + message.content;
            messageElement.className = "message";
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            var sender = document.getElementById('senderInput').value.trim();
            var content = document.getElementById('messageInput').value.trim();
            if (!sender || !content) return;

            var chatMessage = { sender: sender, content: content };
            stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
            document.getElementById('messageInput').value = '';
        }

        document.getElementById('sendMessage').onclick = sendMessage;
    }

    window.onload = connect;
</script>
</body>
</html>
